<!DOCTYPE html>
<html>
<head>
    <title>Trendy Mart - Shop Online</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-amber-50">

    <!-- Header -->
    <header class="bg-emerald-600 text-white p-4">
        <h1 class="text-2xl">Trendy Mart</h1>
    </header>

    <!-- Products -->
    <div class="p-4">
        <h2 class="text-2xl text-center mb-4">Featured Collection</h2>

        <div class="flex flex-wrap justify-center gap-4">

            <!-- Product 1 -->
            <div class="bg-white p-4 w-60">
                <img src="laptop-1.jpg" class="w-full">
                <h3 class="text-xl">Laptop</h3>
                <p>Price: ₹45,999</p>
                <button class="bg-emerald-600 text-white p-2 mt-2">Add to Cart</button>
            </div>

            <!-- Product 2 -->
            <div class="bg-white p-4 w-60">
                <img src="iphone.jpg" class="w-full">
                <h3 class="text-xl">Mobile</h3>
                <p>Price: ₹19,999</p>
                <button class="bg-emerald-600 text-white p-2 mt-2">Add to Cart</button>
            </div>

            <!-- Product 3 -->
            <div class="bg-white p-4 w-60">
                <img src="shooe.jpg" class="w-full">
                <h3 class="text-xl">Shoes</h3>
                <p>Price: ₹2,499</p>
                <button class="bg-emerald-600 text-white p-2 mt-2">Add to Cart</button>
            </div>

            <!-- Product 4 -->
            <div class="bg-white p-4 w-60">
                <img src="watch.jpg" class="w-full">
                <h3 class="text-xl">Watch</h3>
                <p>Price: ₹3,499</p>
                <button class="bg-emerald-600 text-white p-2 mt-2">Add to Cart</button>
            </div>

        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-emerald-900 text-white text-center p-4">
        Trendy Mart © 2026
    </footer>

</body>
</html>
